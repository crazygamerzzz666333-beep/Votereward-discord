name: VoteRewardBot
version: 1.0.0
main: com.voterewardbot.VoteRewardBot
api-version: '1.21'
author: VoteRewardBot Team
description: Discord-integrated voting reward system

commands:
  votereward:
    description: Manage vote rewards
    usage: /votereward <itemadd|remove|list|reload>
    permission: votereward.admin
    aliases: [vr, voterewards]

permissions:
  votereward.admin:
    description: Admin access to vote reward management
    default: op